<title>인쌤 소재 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: top bar + tab rail over one working column of boards; a right-side drawer opens one 소재 (setup / performance) */
:root{
  --paper:#F3F5F1; --surface:#FFFFFF; --sunk:#ECEFEA; --ink:#17211C; --ink-2:#46524C; --mute:#7C8781; --line:#DAE0D8;
  --accent:#137A55; --accent-ink:#FFFFFF; --accent-soft:#DFF0E7;
  --gold:#9A620C; --gold-soft:#F8EDD6; --warn:#A9481F; --warn-soft:#F9E5DB; --bad:#B42318;
  --shadow:0 1px 2px rgba(23,33,28,.06),0 12px 32px rgba(23,33,28,.12);
  --scrim:rgba(17,24,20,.38);
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1412; --surface:#161D1A; --sunk:#1D2521; --ink:#E3EAE6; --ink-2:#ADB8B2; --mute:#7C8883; --line:#2A3430;
    --accent:#45C190; --accent-ink:#07130D; --accent-soft:#163328;
    --gold:#E3AB4E; --gold-soft:#342811; --warn:#EB8A60; --warn-soft:#3A2219; --bad:#F2766A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.58);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1412; --surface:#161D1A; --sunk:#1D2521; --ink:#E3EAE6; --ink-2:#ADB8B2; --mute:#7C8883; --line:#2A3430;
  --accent:#45C190; --accent-ink:#07130D; --accent-soft:#163328;
  --gold:#E3AB4E; --gold-soft:#342811; --warn:#EB8A60; --warn-soft:#3A2219; --bad:#F2766A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.58);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h2,h3,h4{text-wrap:balance;margin:0}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
h3{font-size:13.5px;font-weight:700}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.muted{color:var(--mute)}
.sub{color:var(--ink-2);font-size:13px;margin-top:2px;max-width:68ch}
.num,.code{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.code{font-size:12px;color:var(--ink-2);letter-spacing:.02em}
em{font-style:normal;color:var(--mute);font-weight:400;font-size:11.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:18px 12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand .seal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;align-self:center}
.brand span.tag-line{color:var(--mute);font-size:12.5px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.sync.ok i{background:var(--accent)} .sync.err i{background:var(--warn)} .sync.load i{background:var(--gold)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;margin-bottom:18px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:inherit;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--font-num);font-size:11.5px;color:var(--mute);margin-left:5px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.ai{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.btn.gold{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default;filter:none}

/* generic blocks */
.bar-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap;margin-bottom:12px}
.bar-row > div{min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.block{margin-top:26px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2);background:var(--surface);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-size:15px}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 12px;border-radius:8px;font-size:13px;background:var(--sunk);color:var(--ink-2)}
.note b{color:inherit}
.note.good{background:var(--accent-soft);color:var(--accent)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.gold{background:var(--gold-soft);color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12px;color:var(--mute);margin-top:8px}

/* pills / tags */
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill.plan{color:var(--ink-2);background:var(--sunk)}
.pill.ready{color:var(--gold);background:var(--gold-soft)}
.pill.live{color:var(--accent);background:var(--accent-soft)}
.pill.off{color:var(--mute);border-color:var(--line)}
.pill.win{color:var(--gold);background:var(--gold-soft)}
.pill.cand{color:var(--gold);border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.win-star{color:var(--gold)}

/* stages */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stage{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;font:inherit;color:inherit;cursor:pointer;min-width:0}
.stage:hover{border-color:var(--ink-2)}
.stage[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stage .k{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.stage .v{font-family:var(--font-num);font-size:24px;font-weight:600;line-height:1.2}
.stage .hint{margin:0;font-size:11.5px}
@media (max-width:640px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* list rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .main{display:flex;flex-direction:column;gap:4px;min-width:0}
.row .title{font-weight:600;overflow-wrap:anywhere}
.row .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.checks{display:flex;gap:4px}
.ck{font-size:11px;padding:1px 6px;border-radius:5px;color:var(--mute);border:1px dashed var(--line)}
.ck.ok{color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft)}
.mini{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.mini b{font-family:var(--font-num);color:var(--ink)}
@media (max-width:720px){
  .row{grid-template-columns:52px minmax(0,1fr)}
  .row .right{grid-column:1 / -1;justify-content:flex-start}
}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .k{font-size:12px;color:var(--mute)}
.kpi .v{font-family:var(--font-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35;overflow-wrap:anywhere}
.kpi .s{font-size:11.5px;color:var(--ink-2)}
.kpi.key{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpis.small .kpi{background:var(--sunk);border-color:transparent}
.kpis.small .v{font-size:15px}
.s.good{color:var(--accent)} .s.bad{color:var(--warn)}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 10px}
.toolbar select{width:auto}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font:inherit;font-size:13px}
.toggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font:inherit;color:inherit;cursor:pointer;min-width:0}
.card:hover{border-color:var(--ink-2)}
.card.is-win{border-color:var(--gold)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.card .title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.m3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:8px}
.m{display:flex;flex-direction:column;min-width:0}
.m .k{font-size:11px;color:var(--mute)}
.m .v{font-family:var(--font-num);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.vs{font-size:12px;font-weight:600}
.vs.good{color:var(--accent)} .vs.bad{color:var(--warn)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;border-top:0;background:var(--sunk);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td .sm{font-size:11.5px}
.bartrack{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--sunk);vertical-align:middle;margin-right:8px;overflow:hidden}
.bartrack i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bartrack i.warn{background:var(--warn)}

/* forms */
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);min-width:0}
.f > span{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
input,textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start;background:var(--surface)}
.seg button{border:0;border-left:1px solid var(--line);background:none;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.dim{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:start;padding-block:6px;border-top:1px solid var(--line)}
.dim:first-of-type{border-top:0}
.dim .k{font-size:12.5px;color:var(--ink-2);padding-top:5px;font-weight:600}
.out{display:flex;gap:6px;align-items:stretch}
.out code{flex:1;min-width:0;font-family:var(--font-num);font-size:12.5px;background:var(--sunk);color:var(--ink);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;line-height:1.5}
.line{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:6px;align-items:start}
.ln{font-family:var(--font-num);font-size:12px;color:var(--mute);padding-top:9px;text-align:right}

/* drawer */
#drawer[hidden]{display:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--paper);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.dhead{padding:14px 18px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.dtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:36px;position:relative}
.dtitle b{font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
.close-x{position:absolute;right:-6px;top:-4px}
.dtabs{display:flex;gap:2px;margin-top:6px}
.dbody{flex:1;overflow-y:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:12px}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.foot-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec > h3{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sec > h3 .muted{font-weight:400;font-size:12px}
.lk{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lk:first-child{border-top:0}
.lk-main{display:flex;flex-direction:column;min-width:0}
.lk-main b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.lk-main span{font-size:11.5px;overflow-wrap:anywhere}
.lk-st{font-size:11.5px;color:var(--mute);white-space:nowrap}
.lk-st.on{color:var(--accent);font-weight:600}
.lk .num{font-size:12px;color:var(--ink-2);white-space:nowrap}
@media (max-width:560px){.lk{grid-template-columns:minmax(0,1fr) auto}.lk .num{grid-column:1}}
.picker{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:10px;border-radius:8px;background:var(--sunk)}
.picker .lk{border-top-color:var(--line)}
.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:10px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--bad);flex-wrap:wrap}
.tips{display:flex;flex-direction:column;gap:6px}

/* charts */
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-area{fill:var(--accent-soft)}
.ch-line{stroke:var(--accent);fill:none;stroke-width:2.2}
.ch-dot{fill:var(--accent)}
.ch-dot.hl{fill:var(--warn)}
.ch-bar{fill:var(--accent);opacity:.32}
.ch-cpl{stroke:var(--gold);fill:none;stroke-width:2}
.ch-cpl-dot{fill:var(--gold)}
.ch-t{fill:var(--mute);font-size:10.5px;font-family:var(--font-num)}
.ch-v{fill:var(--ink-2);font-size:11px;font-family:var(--font-num);font-weight:600}
.ch-gold{fill:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .lb{background:var(--accent);opacity:.32}
.legend .lg{background:var(--gold);height:3px;vertical-align:3px}

/* reports */
.rep{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.rep{grid-template-columns:1fr}}
.rep-list{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rep-list h4{font-size:12.5px;color:var(--ink-2);margin:6px 0 2px;display:flex;flex-direction:column;gap:2px}
.rep-item{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;font:inherit;color:inherit;cursor:pointer}
.rep-item:hover{background:var(--sunk)}
.rep-item[aria-current="true"]{border-color:var(--gold);background:var(--gold-soft)}
.rep-item b{font-size:13.5px;overflow-wrap:anywhere}
.rep-item span{font-size:12px;color:var(--ink-2)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:6px 2px;border-top:1px solid var(--line);font-size:12.5px}
.cand .num{font-size:11.5px;color:var(--ink-2)}
.cand .btn{grid-column:1 / -1;justify-self:start}
.aar-sec{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 14px;padding:14px 0;border-top:1px solid var(--line)}
.aar-sec:first-of-type{border-top:0;padding-top:4px}
.aar-sec > h4{font-size:13px;color:var(--accent);letter-spacing:.01em}
.aar-fields{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:600px){.aar-sec{grid-template-columns:1fr}}
.insight{white-space:pre-wrap;line-height:1.7;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-wrap:anywhere}
.dimtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:13px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.foot{margin-top:40px;font-size:12px;color:var(--mute)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="seal" aria-hidden="true">인</span><b>인쌤 소재 허브</b><span class="tag-line">정책자금 광고 소재 → 세팅 → 성과 → 회고</span></div>
    <span id="sync" class="sync"><i></i><span>연결 확인 중</span></span>
  </header>

/* ---------- domain ---------- */
function maxCodeNum() { let max = 0; for (const c of S.creatives) { const m = /^IS(\d+)$/.exec(c.code || ""); if (m) max = Math.max(max, +m[1]); } return max; }
const fmtCode = n => "IS" + String(n).padStart(3, "0");

  const q = new URLSearchParams({ utm_source: "meta", utm_medium: "paid_social", utm_campaign: c.campaignType || "test", utm_content: content });
  return base + (base.includes("?") ? "&" : "?") + q.toString();

function agg(ads) {
  const t = { n: ads.length, active: false, spend: 0, imp: 0, clicks: 0, leads: 0, plays: 0, p25: 0, p50: 0, p75: 0, p100: 0, watchSum: 0 };
  for (const a of ads) {

    t.p25 += a.p25; t.p50 += a.p50; t.p75 += a.p75; t.p100 += a.p100; t.watchSum += a.avgWatch * a.plays;

/* ---------- view: 성과 분석 ---------- */
function acctLine() {

  return `광고 계정 ${h(S.settings.adAccountName || S.settings.adAccountId)} · 전체 기간 누적 · 리드는 메타가 집계한 잠재고객(양식·픽셀) 수예요.`;
}
function metaBanner() {
  if (!S.meta.error) return "";

  return `<div class="note warn" role="status">${h(msg)} ${btn || ""}${S.meta.ads.length ? `<span class="muted">마지막으로 불러온 데이터를 보여드리고 있어요.</span>` : ""}</div>`;
}

const SORTS = {

  leads: ["리드 많은 순", (a, b) => b.m.leads - a.m.leads],
  spend: ["소진액 많은 순", (a, b) => b.m.spend - a.m.spend],

};

  const head = `<div class="bar-row"><div><h2>성과 분석</h2><p class="sub">${acctLine()}</p></div><div class="actions">${refreshBtn}</div></div>`;

/* ---------- view: 분류 분석 ---------- */
function dimRows(dimKey) {
  const groups = new Map();
  for (const c of S.creatives) {
    const m = metricsFor(c); if (!m.n) continue;
    const k = (c.tags && c.tags[dimKey]) || "미분류";
    const g = groups.get(k) || { k, count: 0, spend: 0, leads: 0, imp: 0, clicks: 0, plays: 0, p25: 0, consults: 0, contracts: 0 };
    g.count++; g.spend += m.spend; g.leads += m.leads; g.imp += m.imp; g.clicks += m.clicks; g.plays += m.plays; g.p25 += m.p25; g.consults += m.consults; g.contracts += m.contracts;
    groups.set(k, g);
  }
  return [...groups.values()].map(g => ({ ...g, cpl: g.leads ? g.spend / g.leads : null, ctr: g.imp ? g.clicks / g.imp : null, hold25: g.plays ? g.p25 / g.plays : null, thin: g.count < 2 || g.leads < 10 }))
    .sort((a, b) => (a.k === "미분류") - (b.k === "미분류") || (fin(a.cpl) ? a.cpl : Infinity) - (fin(b.cpl) ? b.cpl : Infinity));
}
function viewDim() {
  const head = `<div class="bar-row"><div><h2>분류 분석</h2><p class="sub">어떤 소구점·후킹·형식이 상담 리드를 싸게 받는지 비교해요. 메타 성과가 붙은 허브 소재만 계산해요.</p></div></div>`;
  if (S.dbState === "off") return head + noDb();
  const dm = DIMS.find(d => d.key === S.dim) || DIMS[0];
  const rows = dimRows(dm.key);
  const avg = accountAvgCpl();
  const maxCpl = Math.max(1, ...rows.map(r => r.cpl || 0));
  const tabs = `<div class="dimtabs">${DIMS.map(d => `<button class="chip" data-act="dim" data-v="${d.key}" aria-pressed="${d.key === dm.key}">${d.label}</button>`).join("")}</div>`;
  if (!rows.length) return head + tabs + `<div class="empty"><b>비교할 데이터가 아직 없어요</b><p>소재에 메타 광고를 연결하고 분류 칩을 채우면 여기에 비교표가 나와요.</p></div>`;
  const ai = S.sample && !S.aiOff;
  const table = `<div class="tbl-wrap"><table><thead><tr><th>${dm.label}</th><th class="n">소재</th><th class="n">소진액</th><th class="n">리드</th><th>리드당 비용</th><th class="n">링크 CTR</th><th class="n">25% 시청</th><th class="n">상담</th><th class="n">계약</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${h(r.k)}</b>${r.thin ? ` <span class="muted sm">표본 적음</span>` : ""}</td><td class="n">${r.count}</td><td class="n">${wonShort(r.spend)}</td><td class="n">${int(r.leads)}</td>
      <td class="num" style="white-space:nowrap">${fin(r.cpl) ? `<span class="bartrack"><i class="${avg && r.cpl > avg ? "warn" : ""}" style="width:${Math.max(4, Math.round(r.cpl / maxCpl * 100))}%"></i></span>${won(r.cpl)}` : "—"}</td>
      <td class="n">${pct(r.ctr, 2)}</td><td class="n">${pct(r.hold25)}</td><td class="n">${int(r.consults)}</td><td class="n">${int(r.contracts)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="hint">막대가 짧을수록 리드를 싸게 받아요. 초록은 계정 평균(${won(avg)})보다 저렴, 주황은 비싼 항목이에요.</p>`;
  const insight = `<section class="block"><div class="bar-row"><div><h3>AI 인사이트</h3><p class="sub">다섯 가지 분류표를 모두 읽고 잘 되는 조합, 피할 것, 다음 소재 아이디어를 정리해요.</p></div>
      <div class="actions">${ai ? (S.insight.status === "busy" ? `<button class="btn sm" data-act="ai-insight-stop">멈추기</button>` : `<button class="btn ai" data-act="ai-insight">✦ ${S.insight.text ? "다시 분석" : "잘 되는 조합 찾기"}</button>`) : `<span class="muted">AI를 쓸 수 없는 화면이에요</span>`}</div></div>
    ${S.insight.status === "busy" && !S.insight.text ? `<div class="insight muted" id="insight">생각하는 중… (30초~1분)</div>` : S.insight.text ? `<div class="insight" id="insight">${h(S.insight.text)}</div>` : ""}</section>`;
  return head + tabs + table + insight;
}

/* ---------- view: 설정 ---------- */

      ${accs.map(a => `<option value="${h(a.ad_account_id)}" ${String(a.ad_account_id) === String(d.adAccountId) ? "selected" : ""} ${a.is_queryable === false ? "disabled" : ""}>${h(a.ad_account_name)}${a.business_name && a.business_name !== a.ad_account_name ? " · " + h(a.business_name) : ""}${a.is_queryable === false ? " (조회 불가)" : ""}</option>`).join("")}</select>`;

    <div class="actions"><span class="muted" id="set-state">${S.setDirty ? "저장 안 됨" : ""}</span><button class="btn primary" data-act="set-save" ${S.db ? "" : "disabled"}>설정 저장</button></div></div>

    <section class="sec"><h3>분류 기준 <button class="btn sm ghost" data-act="set-reset-tax">기본값으로</button></h3>
      <div class="stack">${DIMS.map(dm => `<label class="f">${dm.label} <em>쉼표로 구분</em><textarea data-sf="taxonomy.${dm.key}" rows="2">${h((d.taxonomy[dm.key] || []).join(", "))}</textarea></label>`).join("")}</div></section>
  </div>`;

async function saveSettings() {
  if (!S.db || !S.setDraft) return;
  const d = S.setDraft, tax = {};
  for (const dm of DIMS) { const raw = d.taxonomy[dm.key]; const list = (Array.isArray(raw) ? raw : String(raw || "").split(/[,\n]/)).map(s => String(s).trim()).filter(Boolean); tax[dm.key] = [...new Set(list)].slice(0, 30); if (!tax[dm.key].length) tax[dm.key] = DEFAULT_TAX[dm.key].slice(); }
  const acct = String(d.adAccountId || "").replace(/^act_/, "").trim();
  const data = { adAccountId: acct, adAccountName: acct ? (d.adAccountName || "") : "", landing: String(d.landing || "").trim(), taxonomy: tax, updatedAt: nowIso() };
  try { await S.db.doc("settings/main").set(data); S.setDirty = false; S.setDraft = null; toast("설정을 저장했어요"); renderView(); }
  catch (e) { toast(dbMsg(e)); }
}

/* ---------- drawer ---------- */
function newDraft() { return { code: fmtCode(maxCodeNum() + 1), concept: "", status: "plan", campaignType: "test", tags: {}, keyword: "", landing: "", thumb: "", script: "", primaryTexts: ["", "", "", "", ""], headlines: ["", "", "", "", ""], metaAdIds: [], manual: { consults: 0, contracts: 0 }, note: "", winning: false, createdAt: today() }; }
function normalizeDraft(d) {
  delete d.id;
  d.tags = d.tags && typeof d.tags === "object" ? d.tags : {};
  for (const k of ["primaryTexts", "headlines"]) { d[k] = Array.isArray(d[k]) ? d[k].map(String) : []; while (d[k].length < 5) d[k].push(""); }
  d.manual = d.manual && typeof d.manual === "object" ? d.manual : { consults: 0, contracts: 0 };
  d.metaAdIds = Array.isArray(d.metaAdIds) ? d.metaAdIds.map(String) : [];
  for (const k of ["concept", "keyword", "landing", "thumb", "script", "note"]) d[k] = d[k] == null ? "" : String(d[k]);
  d.status = d.status || "plan"; d.campaignType = d.campaignType || "test";
  return d;
}
function openDrawer(id, tab) {
  const c = id ? S.creatives.find(x => x.id === id) : null;
  S.drawer = { id: c ? c.id : null, isNew: !c, tab: tab || "setup", lastTab: null, draft: c ? normalizeDraft(clone(c)) : newDraft(), dirty: !c, saving: false, linkOpen: false, linkQuery: "", confirmDelete: false, closeAsk: false };
  renderDrawer();
  if (S.drawer.tab === "perf") loadDaily();
}
function closeDrawer() { const D = S.drawer; if (!D) return; if (D.dirty && !D.closeAsk) { D.closeAsk = true; renderDrawer(); return; } S.drawer = null; renderDrawer(); }
function markDirty() {
  const D = S.drawer; if (!D) return; D.dirty = true; D.closeAsk = false;
  const b = $("#dsave"); if (b) b.disabled = !S.db || D.saving;
  const s = $("#dstate"); if (s) s.textContent = "저장 안 됨";
}
function renderDrawer() {
  const root = $("#drawer"), D = S.drawer;
  if (!D) { root.hidden = true; root.innerHTML = ""; document.body.classList.remove("noscroll"); return; }
  const oldBody = root.querySelector(".dbody");

  root.hidden = false; document.body.classList.add("noscroll");
  root.innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="소재 상세">${dHead()}<div class="dbody">${D.tab === "perf" ? dPerf() : dSetup()}</div>${dFoot()}</aside>`;

}

function retentionSvg(m) {
  if (!m.plays) return `<p class="muted">영상 시청 데이터가 없어요. 이미지 광고이거나 아직 재생 기록이 없어요.</p>`;

  const W = 560, H = 176, L = 40, R = 18, T = 20, B = 30;
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (1 - Math.max(0, Math.min(1, v))) * (H - T - B);
  let worst = 0, worstDrop = -1;
  for (let i = 1; i < pts.length; i++) { const drop = pts[i - 1][1] - pts[i][1]; if (drop > worstDrop) { worstDrop = drop; worst = i; } }
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const area = `${x(0)},${y(0)} ${line} ${x(pts.length - 1)},${y(0)}`;
  const grid = [0, .5, 1].map(v => `<line class="ch-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-t" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${Math.round(v * 100)}%</text>`).join("");
  const dots = pts.map((p, i) => `<circle class="ch-dot ${i === worst ? "hl" : ""}" cx="${x(i)}" cy="${y(p[1])}" r="4"/><text class="ch-v" x="${x(i)}" y="${y(p[1]) - 9}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${pct(p[1])}</text><text class="ch-t" x="${x(i)}" y="${H - 10}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${p[0]}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="영상 시청 유지율: 25% ${pct(pts[1][1])}, 50% ${pct(pts[2][1])}, 75% ${pct(pts[3][1])}, 완주 ${pct(pts[4][1])}">${grid}<polygon class="ch-area" points="${area}"/><polyline class="ch-line" points="${line}"/>${dots}</svg>
    <p class="hint">${pts[worst - 1][0]} → ${pts[worst][0]} 구간에서 가장 많이 빠져요 (${(worstDrop * 100).toFixed(1)}%p). 재생한 사람 기준이에요.</p>`;
}
function dailyHtml(dd) {

function dailySvg(rows) {
  const W = 560, H = 186, L = 48, R = 56, T = 14, B = 28, n = rows.length;
  const bw = (W - L - R) / n;
  const maxS = Math.max(1, ...rows.map(r => r.spend));
  const cpls = rows.map(r => r.leads ? r.spend / r.leads : null);
  const maxC = Math.max(1, ...cpls.filter(v => v != null));
  const yS = v => T + (1 - v / maxS) * (H - T - B);
  const yC = v => T + (1 - v / maxC) * (H - T - B);
  const bars = rows.map((r, i) => `<rect class="ch-bar" x="${(L + i * bw + 1).toFixed(1)}" y="${yS(r.spend).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${(H - B - yS(r.spend)).toFixed(1)}"/>`).join("");
  let segs = [], cur = [];
  cpls.forEach((v, i) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(`${(L + i * bw + bw / 2).toFixed(1)},${yC(v).toFixed(1)}`); });
  if (cur.length) segs.push(cur);
  const lines = segs.map(s => s.length > 1 ? `<polyline class="ch-cpl" points="${s.join(" ")}"/>` : "").join("") + cpls.map((v, i) => v == null ? "" : `<circle class="ch-cpl-dot" cx="${(L + i * bw + bw / 2).toFixed(1)}" cy="${yC(v).toFixed(1)}" r="2.4"/>`).join("");
  const md = s => s.slice(5).replace("-", ".");
  const mid = Math.floor((n - 1) / 2);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 30일 일별 소진액과 리드당 비용">
    <line class="ch-grid" x1="${L}" x2="${W - R}" y1="${T}" y2="${T}"/><line class="ch-grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
    <text class="ch-t" x="${L - 6}" y="${T + 4}" text-anchor="end">${wonShort(maxS)}</text><text class="ch-t" x="${L - 6}" y="${H - B + 3}" text-anchor="end">0</text>
    <text class="ch-t ch-gold" x="${W - R + 6}" y="${T + 4}">${won(maxC)}</text><text class="ch-t ch-gold" x="${W - R + 6}" y="${H - B + 3}">0</text>
    ${bars}${lines}
    <text class="ch-t" x="${L}" y="${H - 9}">${md(rows[0].date)}</text>${n > 2 ? `<text class="ch-t" x="${(L + mid * bw + bw / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle">${md(rows[mid].date)}</text>` : ""}<text class="ch-t" x="${W - R}" y="${H - 9}" text-anchor="end">${md(rows[n - 1].date)}</text>
  </svg>`;
}
function aggregateDaily(list) {
  const map = new Map();
  for (const r of list) { const k = r.date_start; if (!k) continue; const o = map.get(k) || { date: k, spend: 0, leads: 0, clicks: 0, imp: 0 }; o.spend += num(r.amount_spent); o.leads += num(r.lead); o.clicks += num(r.link_click); o.imp += num(r.impressions); map.set(k, o); }
  const keys = [...map.keys()].sort(); if (!keys.length) return [];
  const out = []; const d = new Date(keys[0] + "T00:00:00Z"); const end = new Date(keys[keys.length - 1] + "T00:00:00Z");
  while (d <= end) { const k = d.toISOString().slice(0, 10); out.push(map.get(k) || { date: k, spend: 0, leads: 0, clicks: 0, imp: 0 }); d.setUTCDate(d.getUTCDate() + 1); }
  return out;
}

  const prompt = `${VOICE}

아래 소재로 메타 광고에 들어갈 문구를 써주세요.
- primary: 기본 문구 5개. 각 2~4줄, 120자 안팎. 첫 줄은 한숨에 읽히는 후킹. 숫자나 구체적인 단어를 넣고, 마지막 줄은 행동 유도 (예: 아래 버튼 눌러서 우리 회사 가능 한도부터 확인해 보세요).
- headlines: 제목 5개. 각 15자 안팎.
- 5개는 서로 다른 각도로 (손해 회피, 숫자, 비밀, 질문, 마감 등).

${draftBrief(d)}

JSON 하나로만 답하세요: {"primary":["..."],"headlines":["..."]}`;
  const r = await runAi("copy", () => S.sample.json(prompt), scheduleDrawer);
  if (!r || S.drawer !== D) return;
  const p = (Array.isArray(r.primary) ? r.primary : []).map(s => String(s).trim()).filter(Boolean).slice(0, 8);
  const hl = (Array.isArray(r.headlines) ? r.headlines : []).map(s => String(s).trim()).filter(Boolean).slice(0, 8);
  if (!p.length && !hl.length) { toast("AI 답을 읽지 못했어요. 한 번 더 눌러주세요"); return; }
  if (p.length) { d.primaryTexts = p; while (d.primaryTexts.length < 5) d.primaryTexts.push(""); }
  if (hl.length) { d.headlines = hl; while (d.headlines.length < 5) d.headlines.push(""); }
  markDirty(); renderDrawer();
  toast("문구와 제목을 넣었어요. 고친 그대로 저장돼요");
}
async function aiAar() {
  const c = S.creatives.find(x => x.id === S.rep.id); if (!c) return;
  const m = metricsFor(c), avg = accountAvgCpl(), id = c.id;
  const d = normalizeDraft(clone(c));
  const prompt = `${VOICE}

아래는 성과가 좋았던 정책자금 광고 소재(위닝)의 정보와 성과예요. 인쌤이 다음 대본을 쓸 때 참고할 회고(AAR)를 써주세요.
인쌤의 대본 구조는 후킹(1줄) → 주제(2줄) → 혜택(2~6줄) → 포모(2~4줄) → CTA(팔로우·댓글 유도)예요.
숫자 근거를 들고, 추상적인 말 대신 '어떤 문장·장면이 왜 먹혔는지'를 구체적으로 써주세요. 각 항목 1~3문장. 대본이 없으면 컨셉명과 성과만으로 추정하고, 추정이라고 밝혀주세요.

[소재 코드] ${c.code} / [캠페인 유형] ${(CTYPES.find(t => t.key === c.campaignType) || CTYPES[0]).label}
${draftBrief(d)}
[성과 · 메타 전체 기간] 소진액 ${won(m.spend)}, 리드 ${int(m.leads)}건, 리드당 비용 ${won(m.cpl)} (계정 평균 ${won(avg)}), 링크 CTR ${pct(m.ctr, 2)}, 재생 대비 25% 시청 ${pct(m.hold25)}, 완주 ${pct(m.done)}, 평균 시청 ${fin(m.avgWatch) ? m.avgWatch.toFixed(1) + "초" : "-"}, 상담 ${int(m.consults)}건, 계약 ${int(m.contracts)}건
[메모] ${c.note || "(없음)"}

JSON 하나로만 답하세요: {"hypothesis":"","usp":"","background":"","hook":"","benefit":"","fomo":"","visual":"","learning":"","applyNext":""}`;
  const r = await runAi("aar", () => S.sample.json(prompt), scheduleRender);
  if (!r || S.rep.id !== id) return;
  const draft = S.rep.draft || (S.rep.draft = {});
  for (const k of AAR_KEYS) if (typeof r[k] === "string" && r[k].trim()) draft[k] = r[k].trim();
  S.rep.dirty = true; renderView();
  toast("초안을 채웠어요. 고친 뒤 ‘회고 저장’을 눌러주세요");
}
async function aiInsight() {
  if (!S.sample || S.aiOff) return;
  const avg = accountAvgCpl();
  const tables = DIMS.map(dm => `■ ${dm.label}\n` + dimRows(dm.key).map(r => `- ${r.k}: 소재 ${r.count}개, 소진액 ${won(r.spend)}, 리드 ${int(r.leads)}, 리드당 ${won(r.cpl)}, 링크CTR ${pct(r.ctr, 2)}, 25%시청 ${pct(r.hold25)}, 상담 ${int(r.consults)}, 계약 ${int(r.contracts)}${r.thin ? " (표본 적음)" : ""}`).join("\n")).join("\n\n");
  const prompt = `인쌤의 정책자금 메타 광고 소재를 분류별로 묶은 성과표예요. 목표는 상담 리드를 싸게, 많이 받는 거예요. 계정 전체 평균 리드당 비용은 ${won(avg)}예요.

${tables}

아래 세 가지를 짧은 글머리표로 써주세요. 마크다운 굵게 표시는 쓰지 마세요.
1) 잘 되는 조합 3가지 (숫자 근거)
2) 피하거나 고칠 것 2가지
3) 다음에 만들 소재 아이디어 3개 (썸네일 하단 문구 12~15자 + 첫 줄 후킹 한 줄씩)
표본이 적은 항목은 '표본 적음'이라고 표시하고 단정하지 마세요.`;
  const ctl = new AbortController();
  S.insight = { status: "busy", text: "", ctl }; renderView();
  try {
    const res = await S.sample(prompt, { signal: ctl.signal, onText: ({ text }) => { S.insight.text = text; const el = $("#insight"); if (el) { el.textContent = text; el.classList.remove("muted"); } else scheduleRender(); } });
    S.insight = { status: "ok", text: res.text };
  } catch (e) {
    const code = e && e.code;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) S.aiOff = true;
    S.insight = { status: "error", text: e && e.text ? e.text : "" };
    if (code !== "cancelled") toast(sampleMsg(code));
  }
  renderView();
}

/* ---------- meta ---------- */
function entitiesInput(acct) { return { ad_account_id: acct, level: "ad", fields: AD_FIELDS, date_preset: "maximum", sort: "amount_spent_descending", limit: 500, include_additional_context: false, advertiser_job: "assess_and_optimize_performance", client_conversation_id: CONV_ID }; }
let unwatchAds = null, watchedAcct = null, unwatchAcc = null;
function applyAds(result) {
  S.meta.ads = parseEntities(result.payload).map(normAd);
  S.meta.status = "ok"; S.meta.error = null;
  S.meta.storedAt = result.cache ? result.cache.storedAt : Date.now();
  S.meta.revalidating = !!(result.cache && result.cache.revalidating);
}
function handleMetaError(e) {
  const code = (e && e.code) || "upstream_error";
  if (["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required", "not_in_manifest", "selection_required", "not_granted", "capability_disabled", "capability_removed"].includes(code)) S.meta.ads = [];
  S.meta.status = S.meta.ads.length ? "ok" : "error";
  S.meta.error = { code, message: (e && e.message) || "" };
}
function startMetaWatch() {
  const acct = S.settings.adAccountId;
  if (!S.mcp || acct === watchedAcct) return;
  if (unwatchAds) { unwatchAds(); unwatchAds = null; }
  watchedAcct = acct; S.daily = {};
  S.meta = { status: acct ? "loading" : "idle", ads: [], error: null, storedAt: null, revalidating: false };
  if (!acct) { scheduleRender(); return; }
  unwatchAds = S.mcp.watchTool(SERVER, "ads_get_ad_entities", entitiesInput(acct), ev => {
    if (watchedAcct !== acct) return;
    if (ev.type === "data") applyAds(ev.result); else handleMetaError(ev.error);
    scheduleRender(); scheduleDrawer();
    if (S.drawer && S.drawer.tab === "perf") loadDaily();
  }, { cache: CACHE });
  scheduleRender();
}
async function refreshMeta() {
  const acct = S.settings.adAccountId; if (!S.mcp || !acct) return;
  S.meta.status = "loading"; scheduleRender();
  try { const res = await S.mcp.callTool(SERVER, "ads_get_ad_entities", entitiesInput(acct), { cache: { refresh: true, staleTime: CACHE.staleTime, gcTime: CACHE.gcTime } }); if (watchedAcct === acct) applyAds(res); }
  catch (e) { handleMetaError(e); }
  if (S.meta.status === "loading") S.meta.status = S.meta.ads.length ? "ok" : "idle";
  S.daily = {}; scheduleRender(); scheduleDrawer();
  if (S.drawer && S.drawer.tab === "perf") loadDaily();
}
function startAccountsWatch() {
  if (!S.mcp || unwatchAcc) return;
  S.accounts.status = "loading";
  unwatchAcc = S.mcp.watchTool(SERVER, "ads_get_ad_accounts", { advertiser_job: "set_up_and_fix_ad_account", client_conversation_id: CONV_ID, limit: 50 }, ev => {
    if (ev.type === "data") { const p = ev.result.payload; S.accounts = { status: "ok", list: parseList(p && p.ad_accounts), error: null }; }
    else { S.accounts = { status: "error", list: S.accounts.list, error: ev.error }; }
    if (S.tab === "set") scheduleRender();
  }, { cache: CACHE });
}
async function openPerms() {
  const p = S.perms || await use("permissions");
  try { if (p && p.manage) await p.manage(); else throw new Error("none"); }
  catch (e) { toast("페이지 상단의 권한 메뉴에서 ‘메타광고’를 켜주세요"); }
}

/* ---------- copy ---------- */
async function copyText(text, btn) {
  const done = ok => { if (!btn) return; const old = btn.textContent; btn.textContent = ok ? "복사됨" : "선택해서 복사"; setTimeout(() => { btn.textContent = old; }, 1400); };
  try { await navigator.clipboard.writeText(text); done(true); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (err) {} ta.remove(); done(ok);
  }
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, D = S.drawer;
  switch (act) {
    case "tab": setTab(t.dataset.v); break;
    case "stage": S.stageFilter = S.stageFilter === t.dataset.v ? null : t.dataset.v; renderView(); break;
    case "new": openDrawer(null); break;
    case "open": openDrawer(t.dataset.id, t.dataset.tab); break;
    case "close": closeDrawer(); break;
    case "force-close": S.drawer = null; renderDrawer(); break;
    case "dtab": if (D) { D.tab = t.dataset.v; renderDrawer(); if (D.tab === "perf") loadDaily(); } break;
    case "setf": if (D) { setPath(D.draft, t.dataset.f, t.dataset.v); markDirty(); renderDrawer(); } break;
    case "chip": if (D) { const k = t.dataset.dim; D.draft.tags[k] = D.draft.tags[k] === t.dataset.v ? "" : t.dataset.v; markDirty(); renderDrawer(); } break;
    case "save": saveDrawer(); break;
    case "copy": { const el = document.getElementById(t.dataset.target); if (el) copyText(el.textContent, t); break; }
    case "copy-all": if (D) { const p = D.draft.primaryTexts.filter(s => s.trim()), hl = D.draft.headlines.filter(s => s.trim()); copyText(["[기본 문구]", ...p.map((s, i) => `${i + 1}. ${s}`), "", "[제목]", ...hl.map((s, i) => `${i + 1}. ${s}`)].join("\n"), t); } break;
    case "add-line": if (D) { D.draft[t.dataset.list].push(""); markDirty(); renderDrawer(); } break;
    case "rm-line": if (D) { D.draft[t.dataset.list].splice(+t.dataset.i, 1); markDirty(); renderDrawer(); } break;
    case "ai-classify": aiClassify(); break;
    case "ai-copy": aiCopy(); break;
    case "link-toggle": if (D) { D.linkOpen = !D.linkOpen; renderDrawer(); if (D.linkOpen) { const q = $("#link-q"); if (q) q.focus(); } } break;
    case "link": if (D && !D.draft.metaAdIds.includes(t.dataset.id)) { D.draft.metaAdIds.push(t.dataset.id); markDirty(); renderDrawer(); } break;
    case "link-same": if (D) { for (const a of S.meta.ads) if (a.name.trim() === D.draft.concept.trim() && !D.draft.metaAdIds.includes(a.id)) D.draft.metaAdIds.push(a.id); markDirty(); renderDrawer(); } break;
    case "unlink": if (D) { D.draft.metaAdIds = D.draft.metaAdIds.filter(x => x !== t.dataset.id); markDirty(); renderDrawer(); } break;
    case "toggle-win": if (D) { D.draft.winning = !D.draft.winning; markDirty(); renderDrawer(); } break;
    case "del-ask": if (D) { D.confirmDelete = true; renderDrawer(); } break;
    case "del-cancel": if (D) { D.confirmDelete = false; renderDrawer(); } break;
    case "del": deleteCreative(); break;
    case "daily-retry": loadDaily(true); break;
    case "refresh": refreshMeta(); break;
    case "perm": openPerms(); break;
    case "import": { const g = unlinkedGroups().find(x => x.name === t.dataset.name); if (g) importGroups([g]); break; }
    case "import-all": importGroups(unlinkedGroups()); break;
    case "live-only": S.liveOnly = !S.liveOnly; renderView(); break;
    case "dim": S.dim = t.dataset.v; renderView(); break;
    case "ai-insight": aiInsight(); break;
    case "ai-insight-stop": if (S.insight.ctl) S.insight.ctl.abort(); break;
    case "rep-sel": if (S.rep.dirty && S.rep.id !== t.dataset.id) { toast("먼저 ‘회고 저장’을 눌러주세요"); break; } S.rep = { id: t.dataset.id, draft: clone(S.reports[t.dataset.id] || {}), dirty: false, saving: false }; renderView(); break;
    case "mark-win": if (S.db) S.db.doc("creatives/" + t.dataset.id).update({ winning: true, updatedAt: nowIso() }).then(() => toast("위닝으로 표시했어요")).catch(e => toast(dbMsg(e))); break;
    case "ai-aar": aiAar(); break;
    case "rep-save": saveRep(); break;
    case "set-save": saveSettings(); break;
    case "set-reset-tax": if (S.setDraft) { S.setDraft.taxonomy = clone(DEFAULT_TAX); S.setDirty = true; renderView(); } break;
  }
});
document.addEventListener("input", ev => {
  const el = ev.target, D = S.drawer;
  if (el.dataset.f && D) {
    setPath(D.draft, el.dataset.f, el.value); markDirty();
    if (el.dataset.live) updateOutputs();
    if (el.dataset.f === "thumb") { const c = $("#thumb-count"); if (c) c.textContent = [...el.value].length; }
    if (el.dataset.derived) { const box = $("#derived"); if (box) box.innerHTML = derivedHtml(metricsFor(D.draft)); }
  } else if (el.dataset.rf && S.rep.draft) {
    S.rep.draft[el.dataset.rf] = el.value; S.rep.dirty = true;
    const b = $("#rep-save"); if (b) b.disabled = !S.db; const s = $("#rep-state"); if (s) s.textContent = "저장 안 됨";
  } else if (el.dataset.sf && S.setDraft) {
    setPath(S.setDraft, el.dataset.sf, el.value); S.setDirty = true; const s = $("#set-state"); if (s) s.textContent = "저장 안 됨";
  } else if (el.id === "link-q" && D) { D.linkQuery = el.value; const box = $("#link-list"); if (box) box.innerHTML = linkListHtml(); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.id === "sort") { S.sort = el.value; renderView(); }
  if (el.id === "acct" && S.setDraft) { S.setDraft.adAccountId = el.value; const o = el.options[el.selectedIndex]; S.setDraft.adAccountName = el.value && o ? o.textContent.replace(/\s·\s.*$/, "").trim() : ""; S.setDirty = true; const s = $("#set-state"); if (s) s.textContent = "저장 안 됨"; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.drawer) closeDrawer(); });
async function saveRep() {
  const id = S.rep.id; if (!S.db || !id || !S.rep.draft) return;
  const data = {}; for (const k of AAR_KEYS) data[k] = String(S.rep.draft[k] || "").trim();
  data.creativeId = id; data.updatedAt = nowIso();
  S.rep.saving = true; renderView();
  try { await S.db.doc("reports/" + id).set(data); if (S.rep.id === id) S.rep.dirty = false; toast("회고를 저장했어요"); }
  catch (e) { toast(dbMsg(e)); }
  finally { S.rep.saving = false; renderView(); }
}

/* ---------- boot ---------- */
async function boot() {
  renderTabs(); renderSync();
  const [db, mcp, sample, perms] = await Promise.all([use("db"), use("mcp"), use("sample"), use("permissions")]);
  S.db = db; S.mcp = mcp; S.sample = sample; S.perms = perms;
  use("user");
  if (!db) { S.dbState = "off"; scheduleRender(); return; }
  let first = true;
  db.collection("creatives").onSnapshot(snap => {
    S.creatives = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (first) { first = false; S.dbState = "ok"; if (!S.tabChosen && !S.creatives.length) S.tab = "perf"; }
    const D = S.drawer;
    if (D && D.id && !D.dirty && !D.saving) { const c = S.creatives.find(x => x.id === D.id); if (c) { D.draft = normalizeDraft(clone(c)); scheduleDrawer(); } }
    scheduleRender();
  }, e => { S.dbState = "off"; toast(dbMsg(e)); scheduleRender(); });
  db.collection("reports").onSnapshot(snap => {
    const r = {}; for (const d of snap.docs) r[d.id] = d.data(); S.reports = r;
    if (S.rep.id && !S.rep.dirty && !S.rep.saving) S.rep.draft = clone(r[S.rep.id] || {});
    scheduleRender();
  }, () => {});
  db.doc("settings/main").onSnapshot(snap => {
    S.settingsExists = snap.exists;
    S.settings = mergeSettings(snap.exists ? snap.data() : {});
    if (!S.setDirty) S.setDraft = null;
    startMetaWatch(); scheduleRender(); scheduleDrawer();
  }, () => {});
  if (!mcp) scheduleRender();
}
renderTabs();
boot();
})();
</script>
